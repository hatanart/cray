# cray settings. Lines are "setting = value"; # starts a comment.
# Read from /etc/cray/cray.conf, then ./cray.conf, then -c FILE; settings
# on the command line (cray mode=1280x720@50) override all of them.

# ---- game -----------------------------------------------------------------
romdir = /var/lib/cray/roms     # folder with the .ray ROM set and chip files
#rom = pokeri-8460-1.1          # set name (default: this one, else the first .ray)
#nvram = /var/lib/cray/roms/pokeri-8460-1.1.nvram   # default: next to the set
float_coins = 1000              # coins put in the hopper on the first start / F9
save_every = 3600               # battery RAM: saved this often (seconds), 10 s after
                                # coins go in or out (at most once a minute), and at exit
auto_refill = 1                 # when the game closes for lack of coins (P3 84 / 89),
                                # put float_coins back in and restart, like an attendant
# Game features (TESTI 14 "PELIOMINAISUUDET", 8 hex digits). Set while the
# battery RAM holds 00000000 (a new machine), so a value changed in TESTI 14
# stays. 20002000 = bit 13 win music (the jackpot tune for a win of 50 or
# more) + bit 29 saver off (the attract screen isn't dimmed). 0 = leave it.
features = 20002000

# ---- display --------------------------------------------------------------
# The game runs at 50 Hz, so the display is set to 50 Hz too and every
# game frame is shown exactly once. Without a mode setting cray uses the
# screen's own resolution at 50 Hz, else the best 50 Hz mode it offers,
# else the native mode slowed to 50 Hz (custom50 = 0 turns that off).
# The picture is scaled by whole numbers (608x292 -> 1216x584 on 720p).
# Progressive modes are preferred: one game line per screen line.
#connector = HDMI-A-1           # or Composite-1 (cray lists them at start)
#mode = 1280x720@50             # "i" for interlaced, else progressive. Examples:
#   720x576@50     HDMI 576p50, 4:3 (picture 608x584, 2 game lines cropped top/bottom)
#   1216x576@50    576p timing with 1216 pixels a line: no side borders, the
#                  screen stretches the picture to its full width
#                  (not a standard mode; go back to 720x576@50 if it shows nothing)
#   1280x720@50    HDMI 720p50 (1216x584)     1920x1080@50   HDMI 1080p50 (1824x876)
#   720x292@50     PAL composite progressive with all 292 lines (falls back to 720x288)
#   720x288@50     PAL composite progressive 288p (2 lines cropped top/bottom)
#   720x576i@50    PAL composite interlaced
# 576p, 720p and 1080p at 50 Hz are built in (standard CEA-861 timings), so
# they work even when the screen leaves them out of its list.
custom50 = 1
# Picture scale: auto (whole numbers, square pixels on big modes), or
# WxH, e.g. 2x3: each game pixel 2 screen pixels wide and 3 tall. On a 4:3
# CRT the game's pixels were about 1.5 times taller than wide, so 2x3 on
# a 1280x1024 screen (1216x876) is close to the original shape.
#scale = 2x3
realtime = 1                    # real-time priority, so nothing delays a frame
# Scanlines: with 2 or more screen lines per game line (576 or 1080 lines),
# the last of them is drawn this much darker (%, 0 = off). F7 steps
# through 0/25/50/75 while the game runs. Best when the screen shows the
# picture line for line (a scaler resizing it can blur them or make bands).
scanlines = 0

# ---- sound ----------------------------------------------------------------
audio = default                 # ALSA device; see "aplay -L"
volume = 50                     # 0..100
latency_ms = 40

# Sounds for cabinet events, mixed into the game sound (8/16-bit PCM WAV):
#sound.payout = /etc/cray/coin.wav      # each coin the hopper pays out
#sound.coin-in = /etc/cray/coin-in.wav  # each coin put in

# This script runs for every event, with the event name as its argument
# ("payout" or "coin-in"). It is started and not waited for.
event_script = /etc/cray/event.sh

# ---- lamps ----------------------------------------------------------------
# The game drives 23 lamp lines (three 8-bit latches on the light/sound
# board; bit 23 is the sound chip's BDIR, not a lamp). lampN = GPIO number
# (BCM numbering, as in "pinout"), or - for not connected.
# What each line does, from watching the game:
#
#   bit  GPIO  header pin   lamp
#   22    17     11         VALITSE 1 (hold 1): blinks while choosing, steady when held
#   21    27     13         VALITSE 2
#   14    22     15         VALITSE 3
#   11    23     16         VALITSE 4
#    7    24     18         VALITSE 5
#   15    25     22         JAKO (deal)
#    8    12     32         PANOS (bet): blinks until the cards are dealt
#   19    13     33         ? on while idle, off while cards are held
#    2     5     29         always on (cabinet lighting?)
#   10     6     31         always on
#   12    19     35         always on
#   20    16     36         always on
#    4    26     37         only during the power-on lamp test
#   13    20     38         only during the power-on lamp test
#   0 1 3 5 6 9 16 17 18    never seen on (GPIO 21 4 2 18 7 8 9 10 11)
#
# A GPIO pin gives 3.3 V and a few mA: drive lamps through transistors or a
# ULN2803 (8 lamps per chip), never straight from the pin.
#gpiochip = auto                # the SoC's own GPIO (pinctrl-bcm2835 on a Pi 3)
lamp_active_low = 0             # 1 if your driver turns a lamp on with a low pin
lamp22 = 17
lamp21 = 27
lamp14 = 22
lamp11 = 23
lamp7 = 24
lamp15 = 25
lamp8 = 12
lamp19 = 13
lamp2 = 5
lamp10 = 6
lamp12 = 19
lamp20 = 16
lamp4 = 26
lamp13 = 20
lamp0 = 21
lamp1 = 4
lamp3 = 2
lamp5 = 18
lamp6 = 7
lamp9 = 8
lamp16 = 9
lamp17 = 10
lamp18 = 11

# ---- keys -----------------------------------------------------------------
# key.ACTION = keys, separated by spaces. Key names as in Linux
# (ENTER, SPACE, LEFT, F1, KP5, A ...), joystick-style encoder buttons as
# TRIGGER, THUMB, BASE ... or SOUTH, EAST ..., or CODEnnn for any key code.
# cray prints the name of any key that has no action, which helps here.
key.HOLD1 = 1
key.HOLD2 = 2
key.HOLD3 = 3
key.HOLD4 = 4
key.HOLD5 = 5
key.DEAL = ENTER KPENTER SPACE
key.BET = B
key.COLLECT = P
key.DOUBLE = D
key.SMALL = LEFT
key.BIG = RIGHT
key.COIN = I                    # a coin into the coin mech (channel 1)
key.SERVICE = S                 # HUOLTO
key.SRVC1 = F1
key.SRVC2 = F2
key.K13 = F3
key.K14 = F4
key.K15 = F5
key.K16 = F6                    # with the door open: the test menu
key.DOOR = F10                  # door open / closed
key.REFILL = F9                 # refill the payout float and restart
key.QUIT = ESC                  # ignored when kiosk = 1
key.SCANLINES = F7              # scanlines off / 25 / 50 / 75 %
kiosk = 0                       # 1 = Esc doesn't quit (the service sets this)
